name: final
seed: 0
chunking:
  strategy: fixed
  size: 1500
  overlap: 0
  snap_boundaries: false
retrieval:
  k1: 2.0
  b: 0.5
  lowercase: true
  remove_stopwords: false
  stem: false
  strip_query_context: false
  fusion: none
  rrf_k: 60
  doc_boost: 0.0
  candidates: 50
  max_overlap_frac: 0.5
abstention:
  policy: top_score
  threshold: 0.15
  min_gap: 0.0
  topical_min_docs: 8
eval:
  k_values:
  - 1
  - 3
  - 5
  top_k: 5
paths:
  corpus_root: data/raw/legalbench-rag/corpus
  benchmark_file: data/raw/legalbench-rag/benchmarks/cuad.json
  unanswerable_file: data/unanswerable_queries.jsonl
  manifest_file: data/manifests/cuad_mini.json
  cache_dir: cache
  experiments_dir: experiments
