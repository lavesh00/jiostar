name: final
seed: 0
chunking:
  strategy: fixed
  size: 1500
  overlap: 0
  snap_boundaries: false
retrieval:
  k1: 1.2
  b: 0.75
  lowercase: true
  remove_stopwords: true
  stem: true
  strip_query_context: true
  expand_query: true
  fusion: rrf
  rrf_k: 60
  doc_boost: 1.0
  candidates: 50
  max_overlap_frac: 0.5
abstention:
  policy: top_score
  threshold: 0.68
  min_gap: 0.0
  signal: doc_peakedness
  strip_context: false
  topical_min_docs: 0
eval:
  k_values:
  - 1
  - 3
  - 5
  top_k: 5
paths:
  corpus_root: data/raw/legalbench-rag/corpus
  benchmark_file: data/raw/legalbench-rag/benchmarks/cuad.json
  unanswerable_file: data/unanswerable_queries.jsonl
  manifest_file: data/manifests/cuad_mini.json
  cache_dir: cache
  experiments_dir: experiments
